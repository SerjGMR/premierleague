<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Positions</title>
<style>
  :root{
    --bg:#0a0a0c;
    --border:#232327;
    --text:#f5f5f6;
    --muted:#8b8b92;
    --green:#16c784;
    --red:#ea3943;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  /* ---- top tabs ---- */
  .tabs{
    display:flex;
    gap:32px;
    padding:22px 24px 0 24px;
    border-bottom:1px solid var(--border);
  }
  .tab{
    padding-bottom:16px;
    font-size:16px;
    font-weight:600;
    color:var(--muted);
    cursor:default;
  }
  .tab.active{
    color:var(--text);
    border-bottom:2px solid var(--text);
  }

  /* ---- header row ---- */
  .header-row{
    display:flex;
    align-items:center;
    padding:18px 24px;
    border-bottom:1px solid var(--border);
    color:var(--muted);
    font-size:14px;
  }
  .header-row .col{
    cursor:pointer;
    user-select:none;
  }
  .header-row .col:hover{ color:var(--text); }

  /* ---- column widths (shared by header + rows) ---- */
  .col-market{ flex:2.6; text-align:left; display:flex; align-items:center; }
  .col-entry{ flex:0.9; text-align:right; }
  .col-chance{ flex:1; text-align:right; }
  .col-cost{ flex:1; text-align:right; }
  .col-towin{ flex:1; text-align:right; }
  .col-ev{ flex:1.7; text-align:right; }

  /* ---- data rows ---- */
  .row{
    display:flex;
    align-items:center;
    padding:16px 24px;
    border-bottom:1px solid var(--border);
  }
  .row:hover{ background:#111114; }

  .avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    flex:0 0 44px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:13px;
    color:#fff;
    margin-right:14px;
    overflow:hidden;
  }
  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .market-info{ display:flex; flex-direction:column; min-width:0; }
  .market-name{
    font-weight:600;
    font-size:16px;
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .direction-tag{ color:var(--red); font-weight:600; }
  .direction-dot{ color:var(--muted); }
  .market-sub{
    color:var(--muted);
    font-size:13px;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .val{ font-size:16px; }
  .ev-wrap{ display:flex; align-items:baseline; justify-content:flex-end; gap:8px; white-space:nowrap; }
  .ev-main{ font-size:16px; font-weight:500; }
  .ev-delta{ font-size:14px; font-weight:600; display:flex; align-items:center; gap:2px; }
  .up{ color:var(--green); }
  .down{ color:var(--red); }

  .controls{
    display:flex;
    gap:10px;
    padding:14px 24px;
    flex-wrap:wrap;
    align-items:center;
  }
  .controls input, .controls select{
    background:#141416;
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 12px;
    border-radius:8px;
    font-size:14px;
  }
  .controls input{ min-width:220px; }
  .controls label{
    color:var(--muted);
    font-size:13px;
  }
  .dir-toggle{
    background:#141416;
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 12px;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .dir-toggle:hover{ border-color:#3a3a40; }

  .loading,.error{
    padding:40px 24px;
    color:var(--muted);
    text-align:center;
  }
  .error{ color:var(--red); }
</style>
</head>
<body>

<div class="tabs">
  <div class="tab active">Positions</div>
  <div class="tab">Orders</div>
  <div class="tab">History</div>
</div>

<div class="controls">
  <input type="text" id="search" placeholder="Filter by team or contract…">
  <label for="sortMetric">Sort by</label>
  <select id="sortMetric">
    <option value="EV">Expected Value</option>
    <option value="To Win">Win Amount</option>

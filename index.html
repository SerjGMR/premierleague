<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Positions</title>
<style>
  :root{
    --bg:#0a0a0c;
    --border:#232327;
    --text:#f5f5f6;
    --muted:#8b8b92;
    --green:#16c784;
    --red:#ea3943;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  /* ---- top tabs ---- */
  .tabs{
    display:flex;
    gap:32px;
    padding:22px 24px 0 24px;
    border-bottom:1px solid var(--border);
  }
  .tab{
    padding-bottom:16px;
    font-size:16px;
    font-weight:600;
    color:var(--muted);
    cursor:default;
  }
  .tab.active{
    color:var(--text);
    border-bottom:2px solid var(--text);
  }

  /* ---- header row ---- */
  .header-row{
    display:flex;
    align-items:center;
    padding:18px 24px;
    border-bottom:1px solid var(--border);
    color:var(--muted);
    font-size:14px;
  }
  .header-row .col{
    cursor:pointer;
    user-select:none;
  }
  .header-row .col:hover{ color:var(--text); }

  /* ---- column widths (shared by header + rows) ---- */
  .col-market{ flex:2.6; text-align:left; display:flex; align-items:center; }
  .col-entry{ flex:0.9; text-align:right; }
  .col-chance{ flex:1; text-align:right; }
  .col-cost{ flex:1; text-align:right; }
  .col-towin{ flex:1; text-align:right; }
  .col-ev{ flex:1.7; text-align:right; }

  /* ---- data rows ---- */
  .row{
    display:flex;
    align-items:center;
    padding:16px 24px;
    border-bottom:1px solid var(--border);
  }
  .row:hover{ background:#111114; }

  .avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    flex:0 0 44px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:13px;
    color:#fff;
    margin-right:14px;
  }

  .market-info{ display:flex; flex-direction:column; min-width:0; }
  .market-name{
    font-weight:600;
    font-size:16px;
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .direction-tag{ color:var(--red); font-weight:600; }
  .direction-dot{ color:var(--muted); }
  .market-sub{
    color:var(--muted);
    font-size:13px;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .val{ font-size:16px; }
  .ev-wrap{ display:flex; align-items:baseline; justify-content:flex-end; gap:8px; white-space:nowrap; }
  .ev-main{ font-size:16px; font-weight:500; }
  .ev-delta{ font-size:14px; font-weight:600; display:flex; align-items:center; gap:2px; }
  .up{ color:var(--green); }
  .down{ color:var(--red); }

  .controls{
    display:flex;
    gap:10px;
    padding:14px 24px;
  }
  .controls input{
    background:#141416;
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 12px;
    border-radius:8px;
    font-size:14px;
    min-width:220px;
  }

  .loading,.error{
    padding:40px 24px;
    color:var(--muted);
    text-align:center;
  }
  .error{ color:var(--red); }
</style>
</head>
<body>

<div class="tabs">
  <div class="tab active">Positions</div>
  <div class="tab">Orders</div>
  <div class="tab">History</div>
</div>

<div class="controls">
  <input type="text" id="search" placeholder="Filter by team or contract…">
</div>

<div class="header-row" id="headerRow">
  <div class="col col-market" data-key="Team">Market</div>
  <div class="col col-entry" data-key="Average Price">Entry</div>
  <div class="col col-chance" data-key="Chance">Model Chance</div>
  <div class="col col-cost" data-key="Cost">Cost</div>
  <div class="col col-towin" data-key="To Win">To Win</div>
  <div class="col col-ev" data-key="EV">Expected Value</div>
</div>

<div id="body">
  <div class="loading">Loading…</div>
</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTEDZn3nCmmlg-m0mkBlMX2VZ2At99ZEPa-s88XTuQGnhJqBRq0-ETFVEK6FLXdcH8uPCHI6HAgweeL/pub?gid=437407389&single=true&output=csv";

// Colors cycled for the team-initial avatars (no real crests, just distinct fills)
const AVATAR_COLORS = ["#5b6ee1","#e15b8f","#5be1a8","#e1a75b","#8f5be1","#e15b5b","#5bc4e1","#a3e15b"];

/* ============================================================
   CSV parsing
   ============================================================ */
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && next === '\n') i++;
        row.push(field); field = "";
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else { field += c; }
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function toNumber(val) {
  if (val === undefined || val === null) return NaN;
  const cleaned = String(val).replace(/[$,%]/g, "").trim();
  if (cleaned === "" || cleaned === "-") return NaN;
  return parseFloat(cleaned);
}

function fmtMoney(n) {
  if (isNaN(n)) return "—";
  const sign = n < 0 ? "-" : "";
  return `${sign}$${Math.abs(n).toFixed(2)}`;
}

function fmtCents(n) {
  if (isNaN(n)) return "—";
  return `${(n * 100).toFixed(2)}¢`;
}

function fmtPct(n) {
  if (isNaN(n)) return "—";
  return `${n.toFixed(1)}%`;
}

function initials(name) {
  return name.split(/\s+/).map(w => w[0]).join("").slice(0, 3).toUpperCase();
}

function colorFor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}

function contractPhrase(contract) {
  if (/^top\s*\d+/i.test(contract)) return `${contract} Finish`;
  return contract;
}

/* ============================================================
   Render
   ============================================================ */
let currentRows = [];
let sortKey = "EV";
let sortDir = -1;

function applyFilter(rows) {
  const q = document.getElementById("search").value.trim().toLowerCase();
  if (!q) return rows;
  return rows.filter(r =>
    (r["Team"] || "").toLowerCase().includes(q) ||
    (r["Contract"] || "").toLowerCase().includes(q)
  );
}

function renderRows(rows) {
  const body = document.getElementById("body");

  let sorted = rows.slice();
  if (sortKey) {
    sorted.sort((a, b) => {
      const av = toNumber(a[sortKey]);
      const bv = toNumber(b[sortKey]);
      if (!isNaN(av) && !isNaN(bv)) return (av - bv) * sortDir;
      return String(a[sortKey] || "").localeCompare(String(b[sortKey] || "")) * sortDir;
    });
  }

  if (sorted.length === 0) {
    body.innerHTML = `<div class="loading">No positions match.</div>`;
    return;
  }

  body.innerHTML = "";
  sorted.forEach(r => {
    const team = r["Team"] || "";
    const contract = r["Contract"] || "";
    const direction = (r["Direction"] || "").trim();
    const cost = toNumber(r["Cost"]);
    const toWin = toNumber(r["To Win"]);
    const ev = toNumber(r["EV"]);
    const gl = toNumber(r["Gain/Loss"]);
    const chance = toNumber(r["Chance"]);
    const avgPrice = toNumber(r["Average Price"]);
    const glPct = (cost && !isNaN(gl)) ? (gl / cost) * 100 : NaN;
    const isUp = gl >= 0;

    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div class="col col-market">
        <div class="avatar" style="background:${colorFor(team)}">${initials(team)}</div>
        <div class="market-info">
          <div class="market-name">
            ${team}
            ${direction.toLowerCase() === "no" ? `<span class="direction-dot">•</span><span class="direction-tag">No</span>` : ""}
          </div>
          <div class="market-sub">English Premier League &nbsp;${contractPhrase(contract)}</div>
        </div>
      </div>
      <div class="col col-entry"><span class="val">${fmtCents(avgPrice)}</span></div>
      <div class="col col-chance"><span class="val">${fmtPct(chance)}</span></div>
      <div class="col col-cost"><span class="val">${fmtMoney(cost)}</span></div>
      <div class="col col-towin"><span class="val">${fmtMoney(toWin)}</span></div>
      <div class="col col-ev">
        <div class="ev-wrap">
          <span class="ev-main">${fmtMoney(ev)}</span>
          <span class="ev-delta ${isUp ? 'up' : 'down'}">
            ${isUp ? '▲' : '▼'} ${fmtMoney(Math.abs(gl))} (${isNaN(glPct) ? '—' : Math.abs(glPct).toFixed(0) + '%'})
          </span>
        </div>
      </div>
    `;
    body.appendChild(row);
  });
}

async function load() {
  const body = document.getElementById("body");
  try {
    const res = await fetch(CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const table = parseCSV(text).filter(r => r.some(c => c.trim() !== ""));
    const headers = table[0].map(h => h.trim());
    const rows = table.slice(1).map(r => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = (r[i] || "").trim());
      return obj;
    });

    currentRows = rows;
    renderRows(applyFilter(rows));

    document.getElementById("search").addEventListener("input", () => {
      renderRows(applyFilter(currentRows));
    });

    document.querySelectorAll(".header-row .col").forEach(col => {
      col.addEventListener("click", () => {
        const key = col.dataset.key;
        if (sortKey === key) sortDir *= -1;
        else { sortKey = key; sortDir = 1; }
        renderRows(applyFilter(currentRows));
      });
    });
  } catch (err) {
    body.innerHTML = `<div class="error">Couldn't load the sheet: ${err.message}.
      Make sure it's published to the web as CSV (File → Share → Publish to web).</div>`;
  }
}

load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymarket Premier League Trading Model</title>
<style>
  :root{
    --bg:#0a0a0c;
    --border:#232327;
    --text:#f5f5f6;
    --muted:#8b8b92;
    --green:#16c784;
    --red:#ea3943;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  .page-title{ padding:24px 24px 0 24px; }
  .page-title h1{ margin:0; font-size:20px; font-weight:700; }
  .page-title .byline{ margin-top:4px; font-size:13px; color:var(--muted); }

  /* ---- top tabs ---- */
  .tabs{
    display:flex;
    gap:32px;
    padding:22px 24px 0 24px;
    border-bottom:1px solid var(--border);
  }
  .tab{
    padding-bottom:16px;
    font-size:16px;
    font-weight:600;
    color:var(--muted);
    cursor:pointer;
    user-select:none;
    border-bottom:2px solid transparent;
  }
  .tab:hover{ color:var(--text); }
  .tab.active{
    color:var(--text);
    border-bottom-color:var(--text);
  }

  /* ---- header row ---- */
  .header-row{
    display:flex;
    align-items:center;
    padding:18px 24px;
    border-bottom:1px solid var(--border);
    color:var(--muted);
    font-size:14px;
  }
  .header-row .col{
    cursor:pointer;
    user-select:none;
  }
  .header-row .col:hover{ color:var(--text); }

  /* ---- column widths (shared by header + rows) ---- */
  .col-market{ flex:2.6; text-align:left; display:flex; align-items:center; }
  .col-narrow{ flex:0.9; text-align:right; }
  .col-mid{ flex:1; text-align:right; }
  .col-wide{ flex:1.7; text-align:right; }
  .col-tiny{ flex:0.7; text-align:right; }

  /* ---- data rows ---- */
  .row{
    display:flex;
    align-items:center;
    padding:16px 24px;
    border-bottom:1px solid var(--border);
  }
  .row:hover{ background:#111114; }

  .avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    flex:0 0 44px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:13px;
    color:#fff;
    margin-right:14px;
    overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }

  .market-info{ display:flex; flex-direction:column; min-width:0; }
  .market-name{
    font-weight:600;
    font-size:16px;
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .direction-tag{ color:var(--red); font-weight:600; }
  .direction-dot{ color:var(--muted); }
  .market-sub{
    color:var(--muted);
    font-size:13px;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .val{ font-size:16px; }
  .pos-text{ color:var(--green); }
  .neg-text{ color:var(--red); }

  .ev-wrap{ display:flex; align-items:baseline; justify-content:flex-end; gap:8px; white-space:nowrap; }
  .ev-main{ font-size:16px; font-weight:500; }
  .ev-delta{ font-size:14px; font-weight:600; display:flex; align-items:center; gap:2px; }
  .up{ color:var(--green); }
  .down{ color:var(--red); }

  .controls{
    display:flex;
    gap:10px;
    padding:14px 24px;
    flex-wrap:wrap;
    align-items:center;
  }
  .controls input, .controls select{
    background:#141416;
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 12px;
    border-radius:8px;
    font-size:14px;
  }
  .controls input{ min-width:220px; }
  .controls label{ color:var(--muted); font-size:13px; }
  .dir-toggle{
    background:#141416;
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 12px;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .dir-toggle:hover{ border-color:#3a3a40; }

  .loading,.error{
    padding:40px 24px;
    color:var(--muted);
    text-align:center;
  }
  .error{ color:var(--red); }

  .updated-note{
    padding:8px 24px 0 24px;
    font-size:12px;
    color:var(--muted);
  }

  /* ============================================================
     MOBILE LAYOUT
     Below this width, rows collapse from one wide horizontal strip
     into a stacked card: team info on top, then each stat on its
     own line with a small label (since the header row is hidden).
     ============================================================ */
  @media (max-width: 640px) {
    .page-title{ padding:16px 16px 0 16px; }
    .page-title h1{ font-size:17px; }

    .tabs{ padding:16px 16px 0 16px; gap:20px; }
    .tab{ font-size:14px; padding-bottom:12px; }

    .controls{ padding:12px 16px; }
    .controls input{ min-width:0; flex:1 1 100%; }
    .controls label{ flex:0 0 auto; }
    .controls select{ flex:1 1 auto; }
    .dir-toggle{ flex:1 1 auto; justify-content:center; }

    /* Column labels move onto each row as data-label instead */
    .header-row{ display:none; }

    .row{
      flex-direction:column;
      align-items:stretch;
      padding:14px 16px;
      gap:8px;
    }
    .row:hover{ background:none; }

    .col-market{ width:100%; }
    .avatar{ width:38px; height:38px; flex:0 0 38px; margin-right:10px; }
    .market-name{ font-size:15px; }
    .market-sub{ font-size:12px; }

    .col-narrow, .col-mid, .col-wide, .col-tiny{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      text-align:left;
      font-size:14px;
      padding:2px 0;
    }
    .col-narrow::before, .col-mid::before, .col-wide::before, .col-tiny::before{
      content: attr(data-label);
      color:var(--muted);
      font-size:13px;
    }
    .val{ font-size:14px; }
    .ev-wrap{ justify-content:flex-end; }
    .ev-main{ font-size:14px; }
    .ev-delta{ font-size:13px; }
  }
</style>
</head>
<body>

<div class="page-title">
  <h1>Polymarket Premier League Trading Model</h1>
  <div class="byline">by Serj Petrossian</div>
</div>

<div class="tabs" id="tabs">
  <div class="tab active" data-tab="positions">My Positions</div>
  <div class="tab" data-tab="edge">Market Edge</div>
  <div class="tab" data-tab="probabilities">My Probabilities</div>
</div>

<div class="controls">
  <input type="text" id="search" placeholder="Filter by team or contract…">
  <label for="sortMetric">Sort by</label>
  <select id="sortMetric"></select>
  <button class="dir-toggle" id="dirToggle" type="button">
    <span id="dirArrow">▼</span> <span id="dirLabel">High to Low</span>
  </button>
</div>

<div class="header-row" id="headerRow"></div>

<div id="body">
  <div class="loading">Loading…</div>
</div>

<div class="updated-note" id="updatedNote"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const POSITIONS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTEDZn3nCmmlg-m0mkBlMX2VZ2At99ZEPa-s88XTuQGnhJqBRq0-ETFVEK6FLXdcH8uPCHI6HAgweeL/pub?gid=437407389&single=true&output=csv";
const EDGE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTEDZn3nCmmlg-m0mkBlMX2VZ2At99ZEPa-s88XTuQGnhJqBRq0-ETFVEK6FLXdcH8uPCHI6HAgweeL/pub?gid=1149386090&single=true&output=csv";
const PROBABILITIES_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTEDZn3nCmmlg-m0mkBlMX2VZ2At99ZEPa-s88XTuQGnhJqBRq0-ETFVEK6FLXdcH8uPCHI6HAgweeL/pub?gid=360818071&single=true&output=csv";

const REFRESH_MS = 30000; // "live updating" refresh interval

// Colors cycled for the fallback team-initial avatars (used if no logo file is found)
const AVATAR_COLORS = ["#5b6ee1","#e15b8f","#5be1a8","#e1a75b","#8f5be1","#e15b5b","#5bc4e1","#a3e15b"];

// Map each "Team" value to a logo file (sitting at the repo root).
const LOGO_MAP = {
  "Man City":          "manchester-city.football-logos.cc.png",
  "Chelsea":           "chelsea.football-logos.cc.png",
  "Hull":              "hull-city.football-logos.cc.png",
  "Brighton":          "brighton.football-logos.cc.png",
  "Sunderland":        "sunderland.football-logos.cc.png",
  "Liverpool":         "liverpool.football-logos.cc.png",
  "Tottenham":         "tottenham.football-logos.cc.png",
  "Man Utd":           "manchester-united.football-logos.cc.png",
  "Crystal Palace":    "crystal-palace.football-logos.cc.png",
  "Brentford":         "brentford.football-logos.cc.png",
  "Arsenal":           "arsenal.football-logos.cc.png",
  "Coventry":          "coventry-city.football-logos.cc.png",
  "Fulham":            "fulham.football-logos.cc.png",
  "Nottingham Forest": "nottingham-forest.football-logos.cc.png",
  "Leeds":             "leeds-united.football-logos.cc.png",
  "Newcastle":         "newcastle.football-logos.cc.png",
  "Everton":           "everton.football-logos.cc.png",
  "Bournemouth":       "bournemouth.football-logos.cc.png",
  "Aston Villa":       "aston-villa.football-logos.cc.png",
  "Ipswich":           "ipswich.football-logos.cc.png",
};

/* ============================================================
   CSV parsing
   ============================================================ */
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && next === '\n') i++;
        row.push(field); field = "";
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else { field += c; }
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function toNumber(val) {
  if (val === undefined || val === null) return NaN;
  const cleaned = String(val).replace(/[$,%]/g, "").trim();
  if (cleaned === "" || cleaned === "-") return NaN;
  return parseFloat(cleaned);
}

function fmtMoney(n) {
  if (isNaN(n)) return "—";
  const sign = n < 0 ? "-" : "";
  return `${sign}$${Math.abs(n).toFixed(2)}`;
}

function fmtCents(n) {
  if (isNaN(n)) return "—";
  return `${(n * 100).toFixed(2)}¢`;
}

function fmtPct(n, decimals = 1) {
  if (isNaN(n)) return "—";
  return `${n.toFixed(decimals)}%`;
}

function initials(name) {
  return name.split(/\s+/).map(w => w[0]).join("").slice(0, 3).toUpperCase();
}

function colorFor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}

function titleCase(str) {
  return String(str || "").toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

function contractPhrase(contract) {
  const tc = titleCase(contract);
  if (/^top\s*\d+/i.test(tc)) return `${tc} Finish`;
  return tc;
}

function avatarHTML(team) {
  if (LOGO_MAP[team]) {
    return `<div class="avatar"><img src="${LOGO_MAP[team]}" alt="${team}"
      onerror="this.parentElement.outerHTML='<div class=\\'avatar\\' style=\\'background:${colorFor(team)}\\'>${initials(team)}</div>'"></div>`;
  }
  return `<div class="avatar" style="background:${colorFor(team)}">${initials(team)}</div>`;
}

/* ============================================================
   Tab definitions
   ============================================================ */
const TABS = {
  positions: {
    csvUrl: POSITIONS_CSV_URL,
    searchPlaceholder: "Filter by team or contract…",
    headerCols: [
      { key: "Team",       label: "Market",         cls: "col-market" },
      { key: "EntryVal",   label: "Entry",          cls: "col-narrow" },
      { key: "ChanceVal",  label: "Model Chance",   cls: "col-mid" },
      { key: "CostVal",    label: "Cost",           cls: "col-mid" },
      { key: "ToWinVal",   label: "To Win",         cls: "col-mid" },
      { key: "EVVal",      label: "Expected Value", cls: "col-wide" },
    ],
    sortOptions: [
      { value: "EVVal",  label: "Expected Value" },
      { value: "ToWinVal", label: "Win Amount" },
      { value: "GLVal",  label: "$ Gain/Loss" },
      { value: "GLPct",  label: "% Gain/Loss" },
    ],
    defaultSort: { key: "EVVal", dir: -1 },
    parseRows(table) {
      const headers = table[0].map(h => h.trim());
      return table.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, i) => obj[h] = (r[i] || "").trim());
        const cost = toNumber(obj["Cost"]);
        const gl = toNumber(obj["Gain/Loss"]);
        obj.Team = obj["Team"] || "";
        obj.Contract = obj["Contract"] || "";
        obj.Direction = (obj["Direction"] || "").trim();
        obj.EntryVal = toNumber(obj["Average Price"]);
        obj.ChanceVal = toNumber(obj["Chance"]);
        obj.CostVal = cost;
        obj.ToWinVal = toNumber(obj["To Win"]);
        obj.EVVal = toNumber(obj["EV"]);
        obj.GLVal = gl;
        obj.GLPct = (cost && !isNaN(gl)) ? (gl / cost) * 100 : NaN;
        return obj;
      });
    },
    matchesFilter(row, q) {
      return row.Team.toLowerCase().includes(q) || row.Contract.toLowerCase().includes(q);
    },
    renderRow(r) {
      const isUp = r.GLVal >= 0;
      return `
        <div class="col col-market">
          ${avatarHTML(r.Team)}
          <div class="market-info">
            <div class="market-name">
              ${r.Team}
              ${r.Direction.toLowerCase() === "no" ? `<span class="direction-dot">•</span><span class="direction-tag">No</span>` : ""}
            </div>
            <div class="market-sub">English Premier League &nbsp;${contractPhrase(r.Contract)}</div>
          </div>
        </div>
        <div class="col col-narrow" data-label="Entry"><span class="val">${fmtCents(r.EntryVal)}</span></div>
        <div class="col col-mid" data-label="Model Chance"><span class="val">${fmtPct(r.ChanceVal)}</span></div>
        <div class="col col-mid" data-label="Cost"><span class="val">${fmtMoney(r.CostVal)}</span></div>
        <div class="col col-mid" data-label="To Win"><span class="val">${fmtMoney(r.ToWinVal)}</span></div>
        <div class="col col-wide" data-label="Expected Value">
          <div class="ev-wrap">
            <span class="ev-main">${fmtMoney(r.EVVal)}</span>
            <span class="ev-delta ${isUp ? 'up' : 'down'}">
              ${isUp ? '▲' : '▼'} ${fmtMoney(Math.abs(r.GLVal))} (${isNaN(r.GLPct) ? '—' : Math.abs(r.GLPct).toFixed(0) + '%'})
            </span>
          </div>
        </div>
      `;
    }
  },

  edge: {
    csvUrl: EDGE_CSV_URL,
    searchPlaceholder: "Filter by team or contract…",
    headerCols: [
      { key: "Team",       label: "Market",                       cls: "col-market" },
      { key: "EntryVal",   label: "Current Polymarket Ask/Bid",   cls: "col-mid" },
      { key: "VolumeVal",  label: "Volume",                       cls: "col-mid" },
      { key: "ChanceVal",  label: "Model Chance",                 cls: "col-mid" },
      { key: "EdgeVal",    label: "Edge %",                       cls: "col-mid" },
    ],
    sortOptions: [
      { value: "EdgeVal",   label: "Edge %" },
      { value: "ChanceVal", label: "Model Chance" },
      { value: "EntryVal",  label: "Entry Price" },
      { value: "VolumeVal", label: "Volume" },
    ],
    defaultSort: { key: "EdgeVal", dir: -1 },
    // This sheet's columns have no header names for E/I/J/K, so we read by
    // fixed position: A Team, B Contract, C Chance, D Bid, E Bid Volume,
    // F Ask, G Ask Volume, J Edge, K Over/Under.
    parseRows(table) {
      return table.slice(1)
        .filter(r => (r[0] || "").trim() !== "")
        .map(r => {
          const team = (r[0] || "").trim();
          const contract = (r[1] || "").trim();
          const chance = toNumber(r[2]);
          const bid = toNumber(r[3]);
          const bidVolume = toNumber(r[4]);
          const ask = toNumber(r[5]);
          const askVolume = toNumber(r[6]);
          const edge = toNumber(r[9]);
          const overUnder = (r[10] || "").trim();
          const isOver = overUnder.toLowerCase() === "over";
          return {
            Team: team,
            Contract: contract,
            OverUnder: overUnder,
            ChanceVal: chance,
            EntryVal: isOver ? ask : bid,
            VolumeVal: isOver ? askVolume : bidVolume,
            EdgeVal: edge,
          };
        });
    },
    matchesFilter(row, q) {
      return row.Team.toLowerCase().includes(q) || row.Contract.toLowerCase().includes(q);
    },
    renderRow(r) {
      const edgeUp = r.EdgeVal >= 0;
      return `
        <div class="col col-market">
          ${avatarHTML(r.Team)}
          <div class="market-info">
            <div class="market-name">
              ${r.Team}
              ${r.OverUnder.toLowerCase() === "under" ? `<span class="direction-dot">•</span><span class="direction-tag">Under</span>` : ""}
            </div>
            <div class="market-sub">English Premier League &nbsp;${contractPhrase(r.Contract)}</div>
          </div>
        </div>
        <div class="col col-mid" data-label="Current Polymarket Ask/Bid"><span class="val">${fmtCents(r.EntryVal)}</span></div>
        <div class="col col-mid" data-label="Volume"><span class="val">${fmtMoney(r.VolumeVal)}</span></div>
        <div class="col col-mid" data-label="Model Chance"><span class="val">${fmtPct(r.ChanceVal)}</span></div>
        <div class="col col-mid" data-label="Edge %"><span class="val ${edgeUp ? 'pos-text' : 'neg-text'}">${fmtPct(r.EdgeVal)}</span></div>
      `;
    }
  },

  probabilities: {
    csvUrl: PROBABILITIES_CSV_URL,
    searchPlaceholder: "Filter by team…",
    headerCols: [
      { key: "Team",        label: "Market",      cls: "col-market" },
      { key: "Title",       label: "Title",       cls: "col-tiny" },
      { key: "Top 2",       label: "Top 2",       cls: "col-tiny" },
      { key: "Top 4",       label: "Top 4",       cls: "col-tiny" },
      { key: "Top 5",       label: "Top 5",       cls: "col-tiny" },
      { key: "Top 6",       label: "Top 6",       cls: "col-tiny" },
      { key: "Top 10",      label: "Top 10",      cls: "col-tiny" },
      { key: "Relegation",  label: "Relegation",  cls: "col-tiny" },
      { key: "Last Place",  label: "Last Place",  cls: "col-tiny" },
    ],
    sortOptions: [
      { value: "Title",      label: "Title" },
      { value: "Top 2",      label: "Top 2" },
      { value: "Top 4",      label: "Top 4" },
      { value: "Top 5",      label: "Top 5" },
      { value: "Top 6",      label: "Top 6" },
      { value: "Top 10",     label: "Top 10" },
      { value: "Relegation", label: "Relegation" },
      { value: "Last Place", label: "Last Place" },
    ],
    defaultSort: { key: "Title", dir: -1 },
    parseRows(table) {
      const headers = table[0].map(h => h.trim());
      return table.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, i) => obj[h] = (r[i] || "").trim());
        const row = { Team: obj["Team"] || "" };
        headers.slice(1).forEach(h => { row[h] = toNumber(obj[h]); });
        return row;
      });
    },
    matchesFilter(row, q) {
      return row.Team.toLowerCase().includes(q);
    },
    renderRow(r) {
      const cols = ["Title", "Top 2", "Top 4", "Top 5", "Top 6", "Top 10", "Relegation", "Last Place"];
      return `
        <div class="col col-market">
          ${avatarHTML(r.Team)}
          <div class="market-info">
            <div class="market-name">${r.Team}</div>
            <div class="market-sub">English Premier League</div>
          </div>
        </div>
        ${cols.map(c => `<div class="col col-tiny" data-label="${c}"><span class="val">${fmtPct(r[c])}</span></div>`).join("")}
      `;
    }
  }
};

/* ============================================================
   State + shared render/sort/filter engine
   ============================================================ */
let activeTab = "positions";
let cache = {};        // { positions: [...], edge: [...], probabilities: [...] }
let sortState = {};     // { positions: {key,dir}, edge: {key,dir}, probabilities: {key,dir} }
let refreshTimer = null;

Object.keys(TABS).forEach(t => { sortState[t] = { ...TABS[t].defaultSort }; });

function buildHeader() {
  const cfg = TABS[activeTab];
  const headerRow = document.getElementById("headerRow");
  headerRow.innerHTML = "";
  cfg.headerCols.forEach(col => {
    const div = document.createElement("div");
    div.className = `col ${col.cls}`;
    div.dataset.key = col.key;
    div.textContent = col.label;
    div.addEventListener("click", () => {
      const s = sortState[activeTab];
      if (s.key === col.key) s.dir *= -1;
      else { s.key = col.key; s.dir = 1; }
      syncControls();
      render();
    });
    headerRow.appendChild(div);
  });
}

function buildSortDropdown() {
  const cfg = TABS[activeTab];
  const select = document.getElementById("sortMetric");
  select.innerHTML = cfg.sortOptions.map(o => `<option value="${o.value}">${o.label}</option>`).join("");
}

function syncControls() {
  const s = sortState[activeTab];
  const select = document.getElementById("sortMetric");
  const options = Array.from(select.options).map(o => o.value);
  if (options.includes(s.key)) select.value = s.key;

  const arrow = document.getElementById("dirArrow");
  const label = document.getElementById("dirLabel");
  if (s.dir === -1) { arrow.textContent = "▼"; label.textContent = "High to Low"; }
  else { arrow.textContent = "▲"; label.textContent = "Low to High"; }

  document.getElementById("search").placeholder = TABS[activeTab].searchPlaceholder;
}

function render() {
  const cfg = TABS[activeTab];
  const rows = cache[activeTab] || [];
  const q = document.getElementById("search").value.trim().toLowerCase();
  let filtered = q ? rows.filter(r => cfg.matchesFilter(r, q)) : rows.slice();

  const s = sortState[activeTab];
  filtered.sort((a, b) => {
    const av = a[s.key], bv = b[s.key];
    const an = typeof av === "number" ? av : toNumber(av);
    const bn = typeof bv === "number" ? bv : toNumber(bv);
    if (!isNaN(an) && !isNaN(bn)) return (an - bn) * s.dir;
    return String(av || "").localeCompare(String(bv || "")) * s.dir;
  });

  const body = document.getElementById("body");
  if (filtered.length === 0) {
    body.innerHTML = `<div class="loading">${rows.length === 0 ? "Loading…" : "No matches."}</div>`;
    return;
  }
  body.innerHTML = "";
  filtered.forEach(r => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = cfg.renderRow(r);
    body.appendChild(row);
  });
}

async function fetchTab(tabKey) {
  const cfg = TABS[tabKey];
  const res = await fetch(cfg.csvUrl, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  const table = parseCSV(text).filter(r => r.some(c => c.trim() !== ""));
  cache[tabKey] = cfg.parseRows(table);
}

async function loadActiveTab({ silent } = {}) {
  const body = document.getElementById("body");
  if (!silent && !cache[activeTab]) {
    body.innerHTML = `<div class="loading">Loading…</div>`;
  }
  try {
    await fetchTab(activeTab);
    render();
    document.getElementById("updatedNote").textContent =
      `Last updated ${new Date().toLocaleTimeString()}`;
  } catch (err) {
    body.innerHTML = `<div class="error">Couldn't load the sheet: ${err.message}.
      Make sure it's published to the web as CSV (File → Share → Publish to web).</div>`;
  }
}

function switchTab(tabKey) {
  if (tabKey === activeTab) return;
  activeTab = tabKey;
  document.querySelectorAll(".tab").forEach(t => {
    t.classList.toggle("active", t.dataset.tab === tabKey);
  });
  document.getElementById("search").value = "";
  buildHeader();
  buildSortDropdown();
  syncControls();
  loadActiveTab();
}

/* ============================================================
   Init
   ============================================================ */
function init() {
  buildHeader();
  buildSortDropdown();
  syncControls();

  document.getElementById("search").addEventListener("input", render);

  document.getElementById("sortMetric").addEventListener("change", (e) => {
    sortState[activeTab].key = e.target.value;
    render();
  });

  document.getElementById("dirToggle").addEventListener("click", () => {
    sortState[activeTab].dir *= -1;
    syncControls();
    render();
  });

  document.querySelectorAll(".tab").forEach(tabEl => {
    tabEl.addEventListener("click", () => switchTab(tabEl.dataset.tab));
  });

  loadActiveTab();
  refreshTimer = setInterval(() => loadActiveTab({ silent: true }), REFRESH_MS);
}

init();
</script>
</body>
